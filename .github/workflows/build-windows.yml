# Builds the Windows installers on a clean Windows machine and publishes them.
# Which edition is built and published is chosen by a marker in the pushed commit message
# (main or beta branch):
#   [release]          DirectML edition, version from app/__init__.py (official if it has no a/b/rc suffix)
#   [release-cuda]     CUDA edition (NVIDIA), version + "a", always a pre-release
#   [release-openvino] OpenVINO edition (Intel CPU), version + "b", always a pre-release
#   [release-all]      all three
# Actions tab -> "Build Windows installer" -> Run workflow: build all three, artifacts only (no release).
name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      editions:
        description: "Editions to build (comma-separated: directml,cuda,openvino)"
        default: "directml,cuda,openvino"
      run_perf:
        description: "Also run the Windows tests: full suite, GUI smoke, Snap/DPI, performance, stress (no build needed)"
        type: boolean
        default: false
  push:
    branches: [main, beta]

permissions:
  contents: write  # needed to create the Release

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      editions: ${{ steps.pick.outputs.editions }}
    steps:
      - id: pick
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
          WANTED: ${{ github.event.inputs.editions }}
        run: |
          python3 - <<'EOF'
          import json, os
          msg, event = os.environ.get("MESSAGE", ""), os.environ["EVENT"]
          if event != "push":
              editions = [e.strip() for e in (os.environ.get("WANTED") or "directml,cuda,openvino").split(",") if e.strip()]
          elif "[release-all]" in msg:
              editions = ["directml", "cuda", "openvino"]
          else:
              editions = [e for e, m in (("directml", "[release]"), ("cuda", "[release-cuda]"),
                                         ("openvino", "[release-openvino]")) if m in msg]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"editions={json.dumps(editions)}\n")
          print(editions)
          EOF

  build:
    needs: plan
    if: needs.plan.outputs.editions != '[]'
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJson(needs.plan.outputs.editions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build, self-test (network blocked), package
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1 -NonInteractive -Edition ${{ matrix.edition }} *>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # The end of the log as an annotation: readable through the API without the log storage host.
            $tail = (Get-Content build.log -Tail 25 | ForEach-Object { if ($_.Length -gt 160) { $_.Substring(0, 160) } else { $_ } }) -join "%0A"
            Write-Host "::error title=build_windows.ps1 failed (${{ matrix.edition }})::$tail"
            exit $code
          }
          if (Test-Path dist/selftest.json) {  # self-test summary, readable through the API
            $r = Get-Content dist/selftest.json -Raw | ConvertFrom-Json
            Write-Host ("::notice title=self-test (${{ matrix.edition }})::ok=" + $r.ok + " version=" + $r.version + " edition=" + $r.edition + " steps=" + ($r.steps -join " | ") + " gpu=" + ($r.gpu | ConvertTo-Json -Compress -Depth 3))
          }
      - name: Internal test build — installation safety check (official 2.2.1 first, then the test build)
        if: github.event_name == 'workflow_dispatch' && matrix.edition == 'directml'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem dist/installer -Filter "KiraPick-InternalTest-*-Setup.exe" | Select-Object -First 1
          if (-not $setup) { Write-Host "::notice title=install check::not an internal test build: skipped"; exit 0 }
          $failed = @()
          function Check($ok, $what) { if ($ok) { Write-Host "::notice title=install check PASS::$what" } else { Write-Host "::notice title=install check FAIL::$what"; $script:failed += $what } }
          $progs = Join-Path $env:LOCALAPPDATA "Programs"
          $uninst = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall"
          $offKey = "$uninst\{6F2C9B1E-4E57-4C3A-9D2B-5A8C1E7F3B10}_is1"
          $intKey = "$uninst\{3B7D2E91-6A4C-4F18-9E25-C81A0D6F4B72}_is1"
          # 1. The official KiraPick 2.2.1 as a user has it (public release asset; nothing is published)
          gh release download v2.2.1 --repo "${{ github.repository }}" -p "KiraPick-2.2.1-BoCai.zip" -D off
          Expand-Archive off/KiraPick-2.2.1-BoCai.zip off/x
          $offSetup = Get-ChildItem off/x -Recurse -Filter "KiraPick-Setup-2.2.1.exe" | Select-Object -First 1
          Start-Process $offSetup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $offExe = Join-Path $progs "KiraPick\KiraPick.exe"
          Check ((Test-Path $offExe) -and (Test-Path $offKey)) "official 2.2.1 installed at $offExe"
          $offHash = (Get-FileHash $offExe).Hash
          $offVersion = (Get-ItemProperty $offKey).DisplayVersion
          # 2. Existing user data: a sentinel session and learning file (must stay byte-identical)
          $data = Join-Path $env:LOCALAPPDATA "KiraPick"
          New-Item -ItemType Directory -Force (Join-Path $data "sessions\sentinel"), (Join-Path $data "learning") | Out-Null
          Set-Content (Join-Path $data "sessions\sentinel\project.snorlu.db") "sentinel v5 database bytes"
          Set-Content (Join-Path $data "learning\sentinel.json") "{}"
          function DataState { (Get-ChildItem -Recurse -File $data | Get-FileHash | ForEach-Object { "$($_.Path)=$($_.Hash)" }) -join ";" }
          $dataBefore = DataState
          $settingsBefore = (reg query "HKCU\Software\KiraPick" /s 2>$null) -join ";"
          # 3. The internal test build, silently (as the owner will, with the wizard)
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 5
          $intExe = Join-Path $progs "KiraPick-InternalTest\KiraPick.exe"
          Check (Test-Path $intExe) "internal test installed at $intExe"
          $k = Get-ItemProperty $intKey -ErrorAction SilentlyContinue
          Check ($k -ne $null) "own uninstall entry {3B7D2E91-...}_is1: '$($k.DisplayName)' version '$($k.DisplayVersion)' at '$($k.InstallLocation)'"
          Check ($k.DisplayVersion -eq "3.0.0b1.dev1") "installer version 3.0.0b1.dev1"
          Check ((Get-ItemProperty $offKey -ErrorAction SilentlyContinue).DisplayVersion -eq $offVersion) "official uninstall entry unchanged ($offVersion)"
          Check ((Test-Path $offExe) -and ((Get-FileHash $offExe).Hash -eq $offHash)) "official KiraPick.exe 2.2.1 unchanged"
          Check (-not (Get-Process KiraPick -ErrorAction SilentlyContinue)) "no KiraPick process started by the installer"
          Check ((DataState) -eq $dataBefore) "user data (sessions, learning) unchanged by installing: no migration"
          Check (((reg query "HKCU\Software\KiraPick" /s 2>$null) -join ";") -eq $settingsBefore) "app settings unchanged by installing"
          $menu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"
          $links = (Get-ChildItem $menu -Filter "*KiraPick*" | ForEach-Object Name) -join ", "
          Check ($links -match "KiraPick Internal Test" -and $links -match "(^|, )KiraPick\.lnk") "Start menu: $links"
          # 4. The installed test app: version and offline self-test (network blocked inside the app)
          $ver = (Get-Item $intExe).VersionInfo
          Check ($ver.ProductVersion -eq "3.0.0b1.dev1") "KiraPick.exe ProductVersion '$($ver.ProductVersion)' FileVersion '$($ver.FileVersion)'"
          $report = Join-Path $PWD "installed-selftest.json"
          $p = Start-Process $intExe -ArgumentList "--self-test", "`"$report`"" -Wait -PassThru
          $r = if (Test-Path $report) { Get-Content $report -Raw | ConvertFrom-Json } else { $null }
          Check ($p.ExitCode -eq 0 -and $r.ok -eq $true -and $r.version -eq "3.0.0b1.dev1" -and @($r.network_attempts).Count -eq 0) "installed self-test ok=$($r.ok) version=$($r.version) network_attempts=$(@($r.network_attempts).Count) providers=$($r.onnxruntime.providers -join '/')"
          Check ((DataState) -eq $dataBefore) "user data unchanged after the self-test"
          # 5. Uninstall the test build: the official one and the data stay
          Start-Process (Join-Path $progs "KiraPick-InternalTest\unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $intExe); $i++) { Start-Sleep -Seconds 1 }
          Check (-not (Test-Path $intExe) -and -not (Test-Path $intKey)) "internal test uninstalled"
          Check ((Test-Path $offExe) -and ((Get-FileHash $offExe).Hash -eq $offHash) -and (Test-Path $offKey)) "official 2.2.1 still installed and unchanged after uninstalling the test build"
          Check ((DataState) -eq $dataBefore) "user data unchanged after uninstalling"
          Write-Host "::notice title=install check::$($failed.Count) failed"
          if ($failed.Count) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirapick-windows-${{ matrix.edition }}
          path: |
            dist/installer/*
            dist/selftest.json
            installed-selftest.json
          retention-days: 30
      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8  # the title has an en dash
          $env:PYTHONUTF8 = "1"
          $edition = "${{ matrix.edition }}"
          $version = (python -c "from app import __version__; from app.edition import version_for; print(version_for(__version__, '$edition'))").Trim()
          $title = (python -c "from app.edition import release_name; print(release_name('$version', '$edition'))").Trim()
          $tag = "v$version"
          if ($edition -eq "cuda") {
            # Over GitHub's 2 GB per file as one zip: Setup.exe + its .bin data files + the install guide.
            $files = Get-ChildItem dist/installer -File | Where-Object { $_.Extension -in ".exe", ".bin", ".txt" } | ForEach-Object { $_.FullName }
          } else {
            # Only the zips: the small Setup.exe is useless without its .bin data file (both are in BoCai.zip).
            $files = Get-ChildItem dist/installer -File -Filter *.zip | ForEach-Object { $_.FullName }
          }
          if (gh release view $tag 2>$null) { Write-Host "Release $tag already exists: left untouched"; exit 0 }
          if ($edition -ne "directml" -or $version -match '(a|b|rc)\d+$') {  # betas: pre-release
            gh release create $tag $files --target "${{ github.sha }}" --title "$title" --notes-file packaging/notes/RELEASE_NOTES.md --prerelease
          } else {
            gh release create $tag $files --target "${{ github.sha }}" --title "$title" --notes-file packaging/notes/RELEASE_NOTES.md --latest
          }

  # Tests on a real Windows machine (Python 3.12): the full test suite, a GUI smoke run on the real `windows` platform
  # (Windows fonts), Snap sizes at 100/125/150/200 %, performance (synthetic 1k-10k sessions, HD thumbnails) and
  # shutdown / worker stress. Never blocks anything and never publishes: started by hand ("run_perf") or by "[perf]"
  # in a commit message. Each part prints its OWN notice (suite / gui-windows / snap-dpi / perf / stress): the job is
  # non-blocking, so a green job is not evidence that any part passed (review RV14-01) — read the notices.
  perf:
    if: github.event.inputs.run_perf == 'true' || contains(github.event.head_commit.message, '[perf]')
    runs-on: windows-2022
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -q -r packaging/requirements-directml.txt "pytest>=9,<10" "pytest-qt>=4.4,<5"
      - name: Screen and fonts (a bigger desktop for the real-platform steps; what Qt sees)
        if: always()
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "resolution not changed: $_" }
          foreach ($p in "offscreen", "windows") {
            $env:QT_QPA_PLATFORM = $p
            $line = (python scripts/qt_env_report.py 2>&1 | Select-Object -Last 1)
            Write-Host "::notice title=qt $p::$line"
          }
      - name: Full test suite (offscreen)
        if: always()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          . scripts/ci_report.ps1
          $code = Invoke-Pytest -Log suite.log -Title suite -TimeoutSec 1500 -PytestArgs @()
          exit $code
      - name: GUI smoke on the real Windows platform (Windows fonts, real windows; each file alone, 4 min each)
        if: always()
        timeout-minutes: 50
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          COLUMNS: "1500"
          KIRAPICK_EXIT_WATCHDOG: "60"
        run: |
          . scripts/ci_report.ps1
          $failed = 0
          $gui = @("test_compare_tile", "test_compare_view", "test_compare_window", "test_compare_actions",
                   "test_compare_overlay", "test_compare_final", "test_qt_image", "test_viewer_frames",
                   "test_view_rotation", "test_main_window", "test_adaptive_layout", "test_detail_panel",
                   "test_review_notes_t15")
          foreach ($f in $gui) {
            try {
              $code = Invoke-Pytest -Log "gui_$f.log" -Title "gui-windows $f" -TimeoutSec 240 -PytestArgs @("tests/gui/$f.py")
            } catch {
              Write-Host "::notice title=gui-windows $f REPORT ERROR::$_"
              $code = 1
            }
            if ($code -ne 0) { $failed++ }
          }
          Write-Host "::notice title=gui-windows::files failed: $failed of $($gui.Count)"
          exit $failed
      - name: Export GUI on the real Windows platform (part 3; its own step so its notices are not cut at 10)
        if: always()
        timeout-minutes: 20
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          COLUMNS: "1500"
          KIRAPICK_EXIT_WATCHDOG: "60"
        run: |
          . scripts/ci_report.ps1
          $failed = 0
          $gui = @("test_export_dialog_p3", "test_export_plan_thread", "test_export_runs")
          foreach ($f in $gui) {
            try {
              $code = Invoke-Pytest -Log "gui_$f.log" -Title "gui-export $f" -TimeoutSec 240 -PytestArgs @("tests/gui/$f.py")
            } catch {
              Write-Host "::notice title=gui-export $f REPORT ERROR::$_"
              $code = 1
            }
            if ($code -ne 0) { $failed++ }
          }
          Write-Host "::notice title=gui-export::files failed: $failed of $($gui.Count)"
          exit $failed
      - name: Compare GUI on the real Windows platform, 5 more rounds (hover / routing stability; BR-01)
        if: always()
        timeout-minutes: 45
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          KIRAPICK_COMPARE_ROUNDS: "5"
          COLUMNS: "1500"
          KIRAPICK_EXIT_WATCHDOG: "60"
        run: |
          . scripts/ci_report.ps1
          $failed = 0
          for ($i = 1; $i -le $env:KIRAPICK_COMPARE_ROUNDS; $i++) {
            $code = Invoke-Pytest -Log "rep_$i.log" -Title "compare repeat $i" -TimeoutSec 600 -PytestArgs @(
              "tests/gui/test_compare_view.py", "tests/gui/test_compare_window.py", "tests/gui/test_compare_actions.py",
              "tests/gui/test_compare_overlay.py", "tests/gui/test_compare_final.py")
            if ($code -ne 0) { $failed++ }
          }
          exit $failed
      - name: Compare hover diagnostic (real Windows platform; CR-P2-FINAL-01)
        if: always()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          python -X faulthandler scripts/diag_compare_hover.py --out diag.jsonl *>&1 | Tee-Object -FilePath diag.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Host "::notice title=diag exit::exit $code; $((Get-Content diag.log | Select-Object -Last 15) -join ' | ')" }
          if (Test-Path diag.jsonl) { Write-Host "::notice title=diag::$((Get-Content diag.jsonl | Measure-Object).Count) scenarios written (artifact)" }
          $s7 = (Get-Content diag.log | Where-Object { $_ -match "^S7 " } | Select-Object -Last 1)
          if ($s7) { Write-Host "::notice title=diag S7 (resting inside a new window; MouseMove delivered)::$s7" }
          $s8 = (Get-Content diag.log | Where-Object { $_ -match "^S8 " } | Select-Object -Last 1)
          if ($s8) { Write-Host "::notice title=diag S8 (ways to move into a window opened under the pointer)::$s8" }
          exit $code
      - name: Snap sizes and per-monitor DPI scale (real Windows platform)
        if: always()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $failed = 0
          foreach ($f in "1", "1.25", "1.5", "2") {
            $env:QT_SCALE_FACTOR = $f
            $out = python -m pytest -q -p no:cacheprovider tests/gui/test_snap_sizes.py 2>&1
            if ($LASTEXITCODE -ne 0) { $failed++ }
            $summary = ($out | Where-Object { $_ -match "(passed|failed|error)" } | Select-Object -Last 1)
            $failures = ($out | Where-Object { $_ -match "^(FAILED|E  ) " } | Select-Object -First 4) -join " | "
            Write-Host "::notice title=snap-dpi $f::$summary $failures"
          }
          exit $failed
      - name: Performance tests
        if: always()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          KIRAPICK_PERF_OUT: perf.jsonl
        run: |
          . scripts/ci_report.ps1
          $code = Invoke-Pytest -Log perf.log -Title perf-tests -TimeoutSec 2400 -PytestArgs @("-m", "perf", "tests/perf")
          exit $code
      - name: Performance results (4 results per notice; a job keeps only 50 notices)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path perf.jsonl) {
            $all = @(Get-Content perf.jsonl)
            for ($i = 0; $i -lt $all.Count; $i += 4) { Write-Host "::notice title=perf::$(($all[$i..([Math]::Min($i + 3, $all.Count - 1))]) -join ' || ')" }
          }
      - name: Performance variance (BR-02; the three tests 5 times each, then median / p95 / worst across runs)
        if: always()
        timeout-minutes: 60
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          KIRAPICK_PERF_OUT: variance.jsonl
        run: |
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $mem = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)
          Write-Host "::notice title=runner::$($cpu.Name) | $($cpu.NumberOfCores) cores / $($cpu.NumberOfLogicalProcessors) threads | $mem GB RAM | $env:ImageOS $env:ImageVersion"
          for ($i = 1; $i -le 5; $i++) {
            python -m pytest -q -p no:cacheprovider -m perf "tests/perf/test_compare_perf.py::test_compare_on_a_large_session" "tests/perf/test_grid_perf.py::test_sustained_culling[10000]" "tests/perf/test_grid_perf.py::test_long_session_gc_and_memory" *>&1 | Select-Object -Last 3
          }
          python scripts/perf_variance.py variance.jsonl
      - name: Shutdown and worker stress (not reproduced in N runs is not proof)
        if: always()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          . scripts/ci_report.ps1
          $failed = 0  # every run counts (a loop would otherwise report only its last run)
          python -X faulthandler -m pytest -q -p no:cacheprovider -o faulthandler_timeout=180 -o faulthandler_exit_on_timeout=true -m stress tests/gui/test_worker_lifecycle.py tests/gui/test_compare_lifecycle.py *>&1 | Tee-Object -FilePath stress0.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { $failed++; Report-Pytest -Log stress0.log -Title "stress run 0" -Code $code }
          for ($i = 1; $i -le 5; $i++) {
            python -X faulthandler -m pytest -q -p no:cacheprovider -o faulthandler_timeout=180 -o faulthandler_exit_on_timeout=true tests/gui/test_shutdown_timeout.py tests/gui/test_shutdown_callbacks.py tests/unit/test_shutdown.py tests/gui/test_compare_lifecycle.py *>&1 | Tee-Object -FilePath "stress$i.log"
            $code = $LASTEXITCODE
            if ($code -ne 0) { $failed++; Report-Pytest -Log "stress$i.log" -Title "stress run $i" -Code $code }
          }
          Write-Host "::notice title=stress::failed runs: $failed of 6"
          exit $failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirapick-perf-windows
          path: |
            perf.jsonl
            suite.log
            gui_*.log
            rep_*.log
            diag.jsonl
            stress*.log
          retention-days: 30
