# Builds the Windows installer on a clean Windows machine.
# - A push to main whose commit message contains "[release]": build + self-test + publish a
#   GitHub (pre)release "v<app version>" with the files (the tag is created by the release).
# - A pushed version tag (v*) does the same.
# - Actions tab -> "Build Windows installer" -> Run workflow: build + downloadable artifact only.
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write  # needed to create the Release

jobs:
  build:
    if: >-
      github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build, self-test (network blocked), package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1 -NonInteractive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snorlu-windows-installer
          path: |
            dist/installer/*
            dist/selftest.json
          retention-days: 30
      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path app/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$version"
          $files = Get-ChildItem dist/installer -File | ForEach-Object { $_.FullName }
          gh release create $tag $files --target "${{ github.sha }}" --title "Snorlu AI Culling $version (beta)" --notes-file packaging/notes/RELEASE_NOTES.md --prerelease
