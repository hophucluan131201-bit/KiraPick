# Builds the Windows installer on a clean Windows machine.
# - Push a version tag (v*): build + self-test + publish a GitHub Release with the files.
# - Actions tab -> "Build Windows installer" -> Run workflow: build + downloadable artifact only.
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to create the Release

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build, self-test (network blocked), package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1 -NonInteractive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snorlu-windows-installer
          path: |
            dist/installer/*
            dist/selftest.json
          retention-days: 30
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist/installer -File | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" $files --title "Snorlu AI Culling ${{ github.ref_name }} (beta)" --notes-file packaging/notes/RELEASE_NOTES.md --prerelease
