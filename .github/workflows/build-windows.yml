# Builds the Windows installers on a clean Windows machine and publishes them.
# Which edition is built and published is chosen by a marker in the pushed commit message
# (main or beta branch):
#   [release]          DirectML edition, version from app/__init__.py (official if it has no a/b/rc suffix)
#   [release-cuda]     CUDA edition (NVIDIA), version + "a" (official unless the version is a beta, e.g. 3.0.0b1a)
#   [release-openvino] OpenVINO edition (Intel CPU), version + "b", always a pre-release
#   [release-all]      all three
# Actions tab -> "Build Windows installer" -> Run workflow: build all three, artifacts only (no release).
name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      editions:
        description: "Editions to build (comma-separated: directml,cuda,openvino; empty = all three, or none when inspect_release is set)"
        default: ""
      run_perf:
        description: "Also run the Windows tests: full suite, GUI smoke, Snap/DPI, performance, stress (no build needed)"
        type: boolean
        default: false
      k2_repeat:
        description: "K2: P/X latency repeatability, 20 fresh-process runs per test, measurement only (editions=none)"
        type: boolean
        default: false
      lic1_checks:
        description: "LIC-1 checks on Windows: the allow-list tests with the verified weights, then the same with every outbound connection of python.exe blocked by the Windows firewall (editions=none)"
        type: boolean
        default: false
      inspect_release:
        description: "Rights inventory: JSON list of published release tags, e.g. [\"v3.0.0\",\"v3.0.0a\"] (editions=none). Downloads, installs silently, lists files + SHA-256; never runs the app"
        default: ""
  push:
    branches: [main, beta]

permissions:
  contents: write  # needed to create the Release

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      editions: ${{ steps.pick.outputs.editions }}
    steps:
      - id: pick
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
          WANTED: ${{ github.event.inputs.editions }}
          INSPECT: ${{ github.event.inputs.inspect_release }}
          LIC1: ${{ github.event.inputs.lic1_checks }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          msg, event = os.environ.get("MESSAGE", ""), os.environ["EVENT"]
          wanted = (os.environ.get("WANTED") or "").strip()
          checks_only = (os.environ.get("INSPECT") or "").strip() or os.environ.get("LIC1") == "true"
          if event != "push" and checks_only:
              # Release inspection / LIC-1 checks never build: an empty editions box means "none" (CI-1);
              # asking for both is an error
              if wanted not in ("", "none"):
                  print(f"::error::inspect_release / lic1_checks set: editions must be empty or 'none', got '{wanted}' (no build)")
                  sys.exit(1)
              editions = []
          elif event != "push":
              editions = [e.strip() for e in (os.environ.get("WANTED") or "directml,cuda,openvino").split(",")
                          if e.strip() in ("directml", "cuda", "openvino")]  # "none": no build
          elif "[release-all]" in msg:
              editions = ["directml", "cuda", "openvino"]
          else:
              editions = [e for e, m in (("directml", "[release]"), ("cuda", "[release-cuda]"),
                                         ("openvino", "[release-openvino]")) if m in msg]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"editions={json.dumps(editions)}\n")
          print(editions)
          EOF

  build:
    needs: plan
    if: needs.plan.outputs.editions != '[]'
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJson(needs.plan.outputs.editions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build, self-test (network blocked), package
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1 -NonInteractive -Edition ${{ matrix.edition }} *>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # The end of the log as an annotation: readable through the API without the log storage host.
            $tail = (Get-Content build.log -Tail 25 | ForEach-Object { if ($_.Length -gt 160) { $_.Substring(0, 160) } else { $_ } }) -join "%0A"
            Write-Host "::error title=build_windows.ps1 failed (${{ matrix.edition }})::$tail"
            exit $code
          }
          if (Test-Path dist/selftest.json) {  # self-test summary, readable through the API
            $r = Get-Content dist/selftest.json -Raw | ConvertFrom-Json
            Write-Host ("::notice title=self-test (${{ matrix.edition }})::ok=" + $r.ok + " version=" + $r.version + " edition=" + $r.edition + " steps=" + ($r.steps -join " | ") + " gpu=" + ($r.gpu | ConvertTo-Json -Compress -Depth 3))
          }
      - name: Internal test / beta build — installation safety check (official release first, then this build)
        if: github.event_name == 'workflow_dispatch' && (matrix.edition == 'directml' || matrix.edition == 'cuda')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION: ${{ matrix.edition }}
        run: |
          $setup = Get-ChildItem dist/installer -Filter "KiraPick-*-Setup.exe" | Where-Object { $_.Name -like "KiraPick-InternalTest-*" -or $_.Name -like "KiraPick-Beta-*" } | Select-Object -First 1
          if (-not $setup) { Write-Host "::notice title=install check::not an internal test or beta build: skipped"; exit 0 }
          $beta = $setup.Name -like "KiraPick-Beta-*"
          $failed = @(); $lines = @()
          # One summary notice at the end (GitHub shows at most 10 notices per step)
          function Check($ok, $what) { if ($ok) { $script:lines += "PASS $what" } else { $script:lines += "FAIL $what"; $script:failed += $what }; Write-Host ("{0} {1}" -f $(if ($ok) { "PASS" } else { "FAIL" }), $what) }
          $cuda = $env:EDITION -eq "cuda"
          # The official release the owner has for this edition, and this build's own identity
          $offTag = if ($cuda) { "v2.2.0a" } else { "v2.2.1" }
          $offVer = $offTag.Substring(1)
          # Every isolated identity: GUID, folder, name (packaging/installer.iss)
          $ids = @{
            "internal-cuda" = @("{D51C8A47-2B9E-4E63-8F0A-6C3E9B17D284}", "KiraPick-InternalTest-CUDA", "KiraPick Internal Test CUDA");
            "internal-directml" = @("{3B7D2E91-6A4C-4F18-9E25-C81A0D6F4B72}", "KiraPick-InternalTest", "KiraPick Internal Test");
            "beta-cuda" = @("{4183AEC4-58C8-4BB4-9615-7D7C04A276A1}", "KiraPick-Beta-CUDA", "KiraPick Beta CUDA");
            "beta-directml" = @("{AD826157-FE76-4A61-AE96-3C0D98F8DBE0}", "KiraPick-Beta", "KiraPick Beta") }
          $self = "$(if ($beta) { 'beta' } else { 'internal' })-$($env:EDITION)"
          $intGuid, $intDir, $intName = $ids[$self]
          $srcVer = ([regex]::Match((Get-Content app/__init__.py -Raw), '__version__ = "([^"]+)"')).Groups[1].Value
          $intVer = if ($cuda) { "${srcVer}a" } else { $srcVer }
          # The other isolated builds (the owner may have them installed): they must stay untouched
          $others = @($ids.Keys | Where-Object { $_ -ne $self } | Sort-Object)
          $progs = Join-Path $env:LOCALAPPDATA "Programs"
          $uninst = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall"
          $offKey = Join-Path $uninst "{6F2C9B1E-4E57-4C3A-9D2B-5A8C1E7F3B10}_is1"
          $intKey = Join-Path $uninst "${intGuid}_is1"
          # 1. The official KiraPick as a user has it (public release asset; nothing is published)
          if ($cuda) {
            gh release download $offTag --repo "${{ github.repository }}" -p "KiraPick-Setup-$offVer*" -D off/x
          } else {
            gh release download $offTag --repo "${{ github.repository }}" -p "KiraPick-$offVer-BoCai.zip" -D off
            Expand-Archive "off/KiraPick-$offVer-BoCai.zip" off/x
          }
          $offSetup = Get-ChildItem off/x -Recurse -Filter "KiraPick-Setup-$offVer.exe" | Select-Object -First 1
          Start-Process $offSetup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Remove-Item -Recurse -Force off  # disk space (the CUDA release is about 3 GB)
          $offExe = Join-Path $progs "KiraPick\KiraPick.exe"
          Check ((Test-Path $offExe) -and (Test-Path $offKey)) "official $offVer installed at $offExe"
          $offHash = (Get-FileHash $offExe).Hash
          $offVersion = (Get-ItemProperty $offKey).DisplayVersion
          # The other isolated builds, simulated: their folder and their uninstall entry
          $otherHash = @{}
          foreach ($o in $others) {
            $oExe = Join-Path $progs "$($ids[$o][1])\KiraPick.exe"
            New-Item -ItemType Directory -Force (Split-Path $oExe) | Out-Null
            Set-Content $oExe "$o build (simulated)"
            $oKey = Join-Path $uninst "$($ids[$o][0])_is1"
            New-Item -Force $oKey | Out-Null
            New-ItemProperty $oKey -Name DisplayVersion -Value "other-$o" -Force | Out-Null
            $otherHash[$o] = (Get-FileHash $oExe).Hash
          }
          function OthersIntact { foreach ($o in $others) { $oExe = Join-Path $progs "$($ids[$o][1])\KiraPick.exe"; $oKey = Join-Path $uninst "$($ids[$o][0])_is1"; if (-not ((Test-Path $oExe) -and ((Get-FileHash $oExe).Hash -eq $otherHash[$o]) -and ((Get-ItemProperty $oKey -ErrorAction SilentlyContinue).DisplayVersion -eq "other-$o"))) { return $false } }; return $true }
          # 2. Existing user data: a sentinel session and learning file (must stay byte-identical)
          $data = Join-Path $env:LOCALAPPDATA "KiraPick"
          New-Item -ItemType Directory -Force (Join-Path $data "sessions\sentinel"), (Join-Path $data "learning") | Out-Null
          Set-Content (Join-Path $data "sessions\sentinel\project.snorlu.db") "sentinel v5 database bytes"
          Set-Content (Join-Path $data "learning\sentinel.json") "{}"
          reg add "HKCU\Software\KiraPick\KiraPick" /v "export/format" /d "raw_jpeg" /f | Out-Null  # settings as 2.2.x leaves them
          function DataState { (Get-ChildItem -Recurse -File $data | Get-FileHash | ForEach-Object { "$($_.Path)=$($_.Hash)" }) -join ";" }
          $dataBefore = DataState
          $settingsBefore = (reg query "HKCU\Software\KiraPick" /s 2>$null) -join ";"
          # 3. The internal test build, silently (as the owner will, with the wizard)
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 5
          $intExe = Join-Path $progs "$intDir\KiraPick.exe"
          Check (Test-Path $intExe) "this build installed at $intExe"
          $k = Get-ItemProperty $intKey -ErrorAction SilentlyContinue
          Check ($k -ne $null -and $k.DisplayName -like "$intName*") "own uninstall entry ${intGuid}_is1: '$($k.DisplayName)' version '$($k.DisplayVersion)' at '$($k.InstallLocation)'"
          Check ($k.DisplayVersion -eq $intVer) "installer version $intVer"
          Check ((Get-ItemProperty $offKey -ErrorAction SilentlyContinue).DisplayVersion -eq $offVersion) "official uninstall entry unchanged ($offVersion)"
          Check ((Test-Path $offExe) -and ((Get-FileHash $offExe).Hash -eq $offHash)) "official KiraPick.exe $offVer unchanged"
          Check (OthersIntact) "other isolated builds unchanged ($($others -join ', '))"
          Check (-not (Get-Process KiraPick -ErrorAction SilentlyContinue)) "no KiraPick process started by the installer"
          Check ((DataState) -eq $dataBefore) "user data (sessions, learning) unchanged by installing: no migration"
          Check (((reg query "HKCU\Software\KiraPick" /s 2>$null) -join ";") -eq $settingsBefore) "app settings unchanged by installing"
          $menu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"
          $links = (Get-ChildItem $menu -Filter "*KiraPick*" | ForEach-Object Name) -join ", "
          Check ($links -match ([regex]::Escape("$intName.lnk")) -and $links -match "(^|, )KiraPick\.lnk") "Start menu: $links"
          # 4. The installed test app: version and offline self-test (network blocked inside the app)
          $ver = (Get-Item $intExe).VersionInfo
          Check ($ver.ProductVersion -eq $intVer) "KiraPick.exe ProductVersion '$($ver.ProductVersion)' FileVersion '$($ver.FileVersion)'"
          $report = Join-Path $PWD "installed-selftest.json"
          $p = Start-Process $intExe -ArgumentList "--self-test", "`"$report`"" -Wait -PassThru
          $r = if (Test-Path $report) { Get-Content $report -Raw | ConvertFrom-Json } else { $null }
          Check ($p.ExitCode -eq 0 -and $r.ok -eq $true -and $r.version -eq $intVer -and $r.edition -eq $env:EDITION -and @($r.network_attempts).Count -eq 0) "installed self-test ok=$($r.ok) version=$($r.version) edition=$($r.edition) network_attempts=$(@($r.network_attempts).Count) providers=$($r.onnxruntime.providers -join '/') gpu=$($r.gpu.device)"
          if ($cuda) { Check (@($r.onnxruntime.providers) -contains "CUDAExecutionProvider") "CUDA provider present in the installed build (this runner has no NVIDIA card: the run itself uses the CPU)" }
          Check ((DataState) -eq $dataBefore) "user data unchanged after the self-test"
          # Grouping diagnostic (F3): packaged, offline, read-only; a folder without a session gives the fixed error
          $diag = Join-Path $PWD "installed-diagnose.json"
          $nosession = Join-Path $env:RUNNER_TEMP "no-session-folder"
          New-Item -ItemType Directory -Force $nosession | Out-Null
          $dp = Start-Process $intExe -ArgumentList "--diagnose-grouping", "`"$nosession`"", "`"$diag`"" -Wait -PassThru
          $d = if (Test-Path $diag) { Get-Content $diag -Raw | ConvertFrom-Json } else { $null }
          Check ($dp.ExitCode -eq 1 -and $d.ok -eq $false -and "$($d.error)" -like "*no KiraPick session*" -and $d.network_attempts -eq 0 -and $d.app_version -eq $intVer) "installed --diagnose-grouping: exit=$($dp.ExitCode) ok=$($d.ok) network_attempts=$($d.network_attempts) version=$($d.app_version) error='$($d.error)'"
          Check ((DataState) -eq $dataBefore) "user data unchanged after the diagnostic"
          # 5. Uninstall the test build: the official one, the other test build and the data stay
          Start-Process (Join-Path $progs "$intDir\unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $intExe); $i++) { Start-Sleep -Seconds 1 }
          Check (-not (Test-Path $intExe) -and -not (Test-Path $intKey)) "this build uninstalled"
          Check ((Test-Path $offExe) -and ((Get-FileHash $offExe).Hash -eq $offHash) -and (Test-Path $offKey)) "official $offVer still installed and unchanged after uninstalling the test build"
          Check (OthersIntact) "other isolated builds still there after uninstalling this one"
          Check ((DataState) -eq $dataBefore) "user data unchanged after uninstalling"
          # 6. The owner's backup / restore script, with Windows PowerShell 5 as on the owner's PC
          $bk = Join-Path $env:RUNNER_TEMP "SaoLuu"
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File scripts/owner_backup.ps1 -Destination $bk 2>&1 | Out-String
          $made = @(Get-ChildItem $bk -Directory -ErrorAction SilentlyContinue)
          Check ($LASTEXITCODE -eq 0 -and $made.Count -eq 1 -and (Test-Path (Join-Path $made[0].FullName "KiraPick\sessions\sentinel\project.snorlu.db")) -and (Test-Path (Join-Path $made[0].FullName "kirapick-settings.reg")) -and $out -match "SHA-256") "backup script: one new dated folder with sessions + settings, SHA-256 verified"
          $first = (Get-ChildItem -Recurse -File $made[0].FullName | Get-FileHash | ForEach-Object { "$($_.Path)=$($_.Hash)" }) -join ";"
          $again = powershell -NoProfile -ExecutionPolicy Bypass -File scripts/owner_backup.ps1 -Destination $bk 2>&1 | Out-String  # same second on purpose
          $firstAfter = (Get-ChildItem -Recurse -File $made[0].FullName | Get-FileHash | ForEach-Object { "$($_.Path)=$($_.Hash)" }) -join ";"
          Check ($LASTEXITCODE -eq 0 -and @(Get-ChildItem $bk -Directory).Count -eq 2 -and $first -eq $firstAfter) "backup script: a second backup (same second) is a new folder ($((Get-ChildItem $bk -Directory | ForEach-Object Name) -join ', ')), the first is byte-identical"
          Add-Content (Join-Path $data "sessions\sentinel\project.snorlu.db") "changed by the test version"  # as a v7 upgrade would
          $rs = powershell -NoProfile -ExecutionPolicy Bypass -File scripts/owner_backup.ps1 -Restore $made[0].FullName 2>&1 | Out-String
          $aside = @(Get-ChildItem $env:LOCALAPPDATA -Directory -Filter "KiraPick.truoc-khoi-phuc-*")
          Check ($LASTEXITCODE -eq 0 -and (DataState).Replace($data, "") -eq $dataBefore.Replace($data, "") -and $aside.Count -eq 1) "restore script: data back byte-identical, the replaced data kept aside ($($aside.Name))"
          Write-Host "::notice title=install check summary ($($failed.Count) failed)::$($lines -join '%0A')"
          if ($failed.Count) { Write-Host "::notice title=install check FAILED::$($failed -join '%0A')"; exit 1 }
      - name: Official build — upgrade check (previous official release first, then this build over it)
        if: matrix.edition == 'directml' || matrix.edition == 'cuda'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION: ${{ matrix.edition }}
        run: |
          $srcVer = ([regex]::Match((Get-Content app/__init__.py -Raw), '__version__ = "([^"]+)"')).Groups[1].Value
          $cuda = $env:EDITION -eq "cuda"
          $newVer = if ($cuda) { "${srcVer}a" } else { $srcVer }
          $setup = Get-ChildItem dist/installer -Filter "KiraPick-Setup-$newVer.exe" | Select-Object -First 1
          if (-not $setup) { Write-Host "::notice title=upgrade check::not an official build: skipped"; exit 0 }
          $failed = @(); $lines = @()
          function Check($ok, $what) { if ($ok) { $script:lines += "PASS $what" } else { $script:lines += "FAIL $what"; $script:failed += $what }; Write-Host ("{0} {1}" -f $(if ($ok) { "PASS" } else { "FAIL" }), $what) }
          $offTag = if ($cuda) { "v2.2.0a" } else { "v2.2.1" }
          $offVer = $offTag.Substring(1)
          $progs = Join-Path $env:LOCALAPPDATA "Programs"
          $uninst = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall"
          $offKey = Join-Path $uninst "{6F2C9B1E-4E57-4C3A-9D2B-5A8C1E7F3B10}_is1"
          $ids = @{
            "internal-cuda" = @("{D51C8A47-2B9E-4E63-8F0A-6C3E9B17D284}", "KiraPick-InternalTest-CUDA");
            "internal-directml" = @("{3B7D2E91-6A4C-4F18-9E25-C81A0D6F4B72}", "KiraPick-InternalTest");
            "beta-cuda" = @("{4183AEC4-58C8-4BB4-9615-7D7C04A276A1}", "KiraPick-Beta-CUDA");
            "beta-directml" = @("{AD826157-FE76-4A61-AE96-3C0D98F8DBE0}", "KiraPick-Beta") }
          # 1. The previous official KiraPick as a user has it (public release asset)
          if ($cuda) {
            gh release download $offTag --repo "${{ github.repository }}" -p "KiraPick-Setup-$offVer*" -D off/x
          } else {
            gh release download $offTag --repo "${{ github.repository }}" -p "KiraPick-$offVer-BoCai.zip" -D off
            Expand-Archive "off/KiraPick-$offVer-BoCai.zip" off/x
          }
          $offSetup = Get-ChildItem off/x -Recurse -Filter "KiraPick-Setup-$offVer.exe" | Select-Object -First 1
          Start-Process $offSetup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Remove-Item -Recurse -Force off
          $exe = Join-Path $progs "KiraPick\KiraPick.exe"
          Check ((Test-Path $exe) -and ((Get-ItemProperty $offKey -ErrorAction SilentlyContinue).DisplayVersion -eq $offVer)) "previous official $offVer installed"
          $oldHash = (Get-FileHash $exe).Hash
          # The isolated builds (internal tests, betas), simulated: an official upgrade must leave them alone
          $otherHash = @{}
          foreach ($o in $ids.Keys) {
            $oExe = Join-Path $progs "$($ids[$o][1])\KiraPick.exe"
            New-Item -ItemType Directory -Force (Split-Path $oExe) | Out-Null
            Set-Content $oExe "$o build (simulated)"
            $oKey = Join-Path $uninst "$($ids[$o][0])_is1"
            New-Item -Force $oKey | Out-Null
            New-ItemProperty $oKey -Name DisplayVersion -Value "other-$o" -Force | Out-Null
            $otherHash[$o] = (Get-FileHash $oExe).Hash
          }
          function OthersIntact { foreach ($o in $ids.Keys) { $oExe = Join-Path $progs "$($ids[$o][1])\KiraPick.exe"; $oKey = Join-Path $uninst "$($ids[$o][0])_is1"; if (-not ((Test-Path $oExe) -and ((Get-FileHash $oExe).Hash -eq $otherHash[$o]) -and ((Get-ItemProperty $oKey -ErrorAction SilentlyContinue).DisplayVersion -eq "other-$o"))) { return $false } }; return $true }
          # 2. Existing user data and settings (must stay byte-identical: the installer migrates nothing)
          $data = Join-Path $env:LOCALAPPDATA "KiraPick"
          New-Item -ItemType Directory -Force (Join-Path $data "sessions\sentinel"), (Join-Path $data "learning") | Out-Null
          Set-Content (Join-Path $data "sessions\sentinel\project.snorlu.db") "sentinel v5 database bytes"
          Set-Content (Join-Path $data "learning\sentinel.json") "{}"
          reg add "HKCU\Software\KiraPick\KiraPick" /v "export/format" /d "raw_jpeg" /f | Out-Null
          function DataState { (Get-ChildItem -Recurse -File $data | Get-FileHash | ForEach-Object { "$($_.Path)=$($_.Hash)" }) -join ";" }
          $dataBefore = DataState
          $settingsBefore = (reg query "HKCU\Software\KiraPick" /s 2>$null) -join ";"
          # 3. This build over it, silently (an update from the app runs the same installer)
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 5
          $k = Get-ItemProperty $offKey -ErrorAction SilentlyContinue
          Check ($k.DisplayVersion -eq $newVer -and $k.DisplayName -eq "KiraPick") "official entry upgraded in place: '$($k.DisplayName)' $offVer -> '$($k.DisplayVersion)' at '$($k.InstallLocation)'"
          Check ((Test-Path $exe) -and (Get-FileHash $exe).Hash -ne $oldHash) "KiraPick.exe replaced in $exe"
          $ver = (Get-Item $exe).VersionInfo
          Check ($ver.ProductVersion -eq $newVer) "KiraPick.exe ProductVersion '$($ver.ProductVersion)'"
          Check (OthersIntact) "internal test and beta builds unchanged ($(($ids.Keys | Sort-Object) -join ', '))"
          Check ((DataState) -eq $dataBefore) "user data (sessions, learning) unchanged by upgrading: no migration by the installer"
          Check (((reg query "HKCU\Software\KiraPick" /s 2>$null) -join ";") -eq $settingsBefore) "app settings unchanged by upgrading"
          $menu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"
          $links = (Get-ChildItem $menu -Filter "*KiraPick*" | ForEach-Object Name) -join ", "
          Check ($links -match "(^|, )KiraPick\.lnk") "Start menu: $links"
          Get-Process KiraPick -ErrorAction SilentlyContinue | Stop-Process -Force  # a silent install does not start it; be sure
          # 4. The upgraded app: version and offline self-test (network blocked inside the app)
          $report = Join-Path $PWD "installed-selftest.json"
          $p = Start-Process $exe -ArgumentList "--self-test", "`"$report`"" -Wait -PassThru
          $r = if (Test-Path $report) { Get-Content $report -Raw | ConvertFrom-Json } else { $null }
          Check ($p.ExitCode -eq 0 -and $r.ok -eq $true -and $r.version -eq $newVer -and $r.edition -eq $env:EDITION -and @($r.network_attempts).Count -eq 0) "installed self-test ok=$($r.ok) version=$($r.version) edition=$($r.edition) network_attempts=$(@($r.network_attempts).Count) providers=$($r.onnxruntime.providers -join '/')"
          if ($cuda) { Check (@($r.onnxruntime.providers) -contains "CUDAExecutionProvider") "CUDA provider present in the installed build" }
          Check ((DataState) -eq $dataBefore) "user data unchanged after the self-test"
          # 5. Uninstall: the program goes, the data stays
          Start-Process (Join-Path $progs "KiraPick\unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          Check (-not (Test-Path $exe) -and -not (Test-Path $offKey)) "uninstalled"
          Check (OthersIntact) "internal test and beta builds still there after uninstalling"
          Check ((DataState) -eq $dataBefore) "user data unchanged after uninstalling"
          Write-Host "::notice title=upgrade check summary ($($failed.Count) failed)::$($lines -join '%0A')"
          if ($failed.Count) { Write-Host "::notice title=upgrade check FAILED::$($failed -join '%0A')"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirapick-windows-${{ matrix.edition }}
          path: |
            dist/installer/*
            dist/selftest.json
            installed-selftest.json
            installed-diagnose.json
          retention-days: 30
      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8  # the title has an en dash
          $env:PYTHONUTF8 = "1"
          $edition = "${{ matrix.edition }}"
          $version = (python -c "from app import __version__; from app.edition import version_for; print(version_for(__version__, '$edition'))").Trim()
          $title = (python -c "from app.edition import release_name; print(release_name('$version', '$edition'))").Trim()
          $tag = "v$version"
          if ($edition -eq "cuda") {
            # Over GitHub's 2 GB per file as one zip: Setup.exe + its .bin data files + the install guide.
            $files = Get-ChildItem dist/installer -File | Where-Object { $_.Extension -in ".exe", ".bin", ".txt", ".ps1" } | ForEach-Object { $_.FullName }
          } else {
            # Only the zips: the small Setup.exe is useless without its .bin data file (both are in BoCai.zip).
            $files = Get-ChildItem dist/installer -File -Filter *.zip | ForEach-Object { $_.FullName }
          }
          if (gh release view $tag 2>$null) { Write-Host "Release $tag already exists: left untouched"; exit 0 }
          # Each edition has its own page text (packaging/release-notes/<edition>.md); RELEASE_NOTES.md otherwise
          $notes = if (Test-Path "packaging/release-notes/$edition.md") { "packaging/release-notes/$edition.md" } else { "packaging/notes/RELEASE_NOTES.md" }
          $pre = (python -c "from app.edition import is_prerelease; print(is_prerelease('$version', '$edition'))").Trim()
          if ($pre -eq "True") {  # betas and OpenVINO: pre-release
            gh release create $tag $files --target "${{ github.sha }}" --title "$title" --notes-file $notes --prerelease
          } else {
            # official; only the DirectML edition is marked "Latest" (the updater of each edition finds its own tag)
            $latest = if ($edition -eq "directml") { "--latest" } else { "--latest=false" }
            gh release create $tag $files --target "${{ github.sha }}" --title "$title" --notes-file $notes $latest
          }

  # Tests on a real Windows machine (Python 3.12): the full test suite, a GUI smoke run on the real `windows` platform
  # (Windows fonts), Snap sizes at 100/125/150/200 %, performance (synthetic 1k-10k sessions, HD thumbnails) and
  # shutdown / worker stress. Never blocks anything and never publishes: started by hand ("run_perf") or by "[perf]"
  # in a commit message. Each part prints its OWN notice (suite / gui-windows / snap-dpi / perf / stress): the job is
  # non-blocking, so a green job is not evidence that any part passed (review RV14-01) — read the notices.
  # K2: P/X latency repeatability (measurement only; thresholds live in the perf tests and are unchanged).
  # Rights inventory (docs/legal/kiem-ke-quyen-su-dung.md): what a PUBLISHED installer really contains. Downloads the
  # release assets, checks them against GitHub's digests, installs silently on this throw-away runner and lists every
  # installed file with its SHA-256. KiraPick.exe is never started, so no model is loaded; nothing is built or published.
  inspect-release:
    if: github.event.inputs.inspect_release != ''
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(github.event.inputs.inspect_release) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download, verify, install silently, inventory
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $PWD "inventory"; New-Item -ItemType Directory -Force $out | Out-Null
          $rel = gh api "repos/${{ github.repository }}/releases/tags/$env:TAG" | ConvertFrom-Json
          $dl = Join-Path $env:RUNNER_TEMP "dl"; New-Item -ItemType Directory -Force $dl | Out-Null
          $assets = @()
          foreach ($a in $rel.assets) {
            gh release download $env:TAG --repo "${{ github.repository }}" -p $a.name -D $dl --clobber
            $sha = (Get-FileHash (Join-Path $dl $a.name) -Algorithm SHA256).Hash.ToLower()
            $assets += [pscustomobject]@{ name = $a.name; bytes = $a.size; sha256 = $sha; github_digest = $a.digest; match = ("sha256:$sha" -eq $a.digest) }
          }
          $zip = Get-ChildItem $dl -Filter "*-BoCai.zip" | Select-Object -First 1
          if ($zip) { Expand-Archive $zip.FullName (Join-Path $dl "x") ; $root = Join-Path $dl "x" } else { $root = $dl }
          # Portable zip (if published): list and hash its model files without installing anything
          $portable = Get-ChildItem $dl -Filter "*-portable.zip" | Select-Object -First 1
          if ($portable) {
            $px = Join-Path $env:RUNNER_TEMP "portable"; Expand-Archive $portable.FullName $px -Force
            $pm = @(Get-ChildItem $px -Recurse -File | Where-Object { $_.DirectoryName -like "*\models" } | ForEach-Object { "$($_.Name) $($_.Length) $((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())" })
            Write-Host "::notice title=inventory portable $env:TAG::$($portable.Name)%0A$($pm -join '%0A')"
            Remove-Item -Recurse -Force $px
          }
          $setup = Get-ChildItem $root -Recurse -Filter "*Setup*.exe" | Select-Object -First 1
          # Every installer file (standalone asset and the one inside BoCai.zip), to show whether they are the same file
          $ins = @(Get-ChildItem $dl -Recurse -File | Where-Object { $_.Name -like "*Setup*" -and $_.Extension -in ".exe", ".bin" } | ForEach-Object {
            "$($_.FullName.Substring($dl.Length + 1)) $($_.Length) $((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())" })
          Write-Host "::notice title=installers $env:TAG::installed: $($setup.FullName.Substring($dl.Length + 1))%0A$($ins -join '%0A')"
          $before = @(Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Directory -ErrorAction SilentlyContinue | ForEach-Object Name)
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOICONS" -Wait
          Get-Process KiraPick, "Snorlu*" -ErrorAction SilentlyContinue | Stop-Process -Force
          # The installed folder: the one holding a models folder (older versions used other names)
          $app = (Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Directory | Where-Object { Test-Path (Join-Path $_.FullName "models") } | Select-Object -First 1).FullName
          # LIC-1 acceptance P1-P4 on what is really installed (old releases are expected to fail: information only)
          $ed = if ($env:TAG -match "a$") { "cuda" } else { "directml" }
          python scripts/check_package.py $app --edition $ed --json (Join-Path $out "package-check.json") *>&1 | Tee-Object -Variable pc | Out-Null
          Write-Host "::notice title=package check $env:TAG::$(($pc | Select-Object -Last 12) -join '%0A')"
          $files = Get-ChildItem $app -Recurse -File | ForEach-Object {
            [pscustomobject]@{ path = $_.FullName.Substring($app.Length + 1); bytes = $_.Length; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() } }
          $models = @($files | Where-Object { $_.path -like "models\*" })
          $sidecars = @{}
          foreach ($m in $models | Where-Object { $_.path -like "*.sha256" }) { $sidecars[$m.path] = (Get-Content (Join-Path $app $m.path) -Raw).Trim() }
          $docs = @($files | Where-Object { $_.path -like "docs\*" } | ForEach-Object { $_.path })
          $licTexts = @{}
          foreach ($d in $docs) { $t = Get-Content (Join-Path $app $d) -Raw -ErrorAction SilentlyContinue
            $licTexts[$d] = [pscustomobject]@{ apache2_full = [bool]($t -match "TERMS AND CONDITIONS FOR USE, REPRODUCTION"); lgpl3_full = [bool]($t -match "GNU LESSER GENERAL PUBLIC LICENSE\s+Version 3"); lgpl21_full = [bool]($t -match "GNU LESSER GENERAL PUBLIC LICENSE\s+Version 2\.1"); ccby4_full = [bool]($t -match "Attribution 4\.0 International"); mentions_polyform = [bool]($t -match "PolyForm"); mentions_insightface = [bool]($t -match "InsightFace") } }
          $report = [pscustomobject]@{ tag = $env:TAG; target = $rel.target_commitish; release_name = $rel.name; prerelease = $rel.prerelease; assets = $assets; installed_root = $app; file_count = $files.Count; models = $models; model_sidecars = $sidecars; docs = $docs; doc_license_texts = $licTexts; app_started = $false }
          $report | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $out "inventory-$env:TAG.json") -Encoding UTF8
          $files | ConvertTo-Json -Depth 3 | Set-Content (Join-Path $out "installed-files-$env:TAG.json") -Encoding UTF8
          $lines = @("assets: " + (($assets | ForEach-Object { "$($_.name) match=$($_.match)" }) -join "; "))
          $lines += "installed files: $($files.Count); models: " + (($models | Where-Object { $_.path -notlike '*.sha256' } | ForEach-Object { Split-Path $_.path -Leaf }) -join ", ")
          $lines += "docs: " + ($docs -join ", ")
          Write-Host "::notice title=inventory $env:TAG::$($lines -join '%0A')"
          $mlines = @($models | ForEach-Object { "$($_.path) $($_.bytes) $($_.sha256)" + $(if ($sidecars.ContainsKey($_.path + ".sha256")) { " sidecar=" + $sidecars[$_.path + ".sha256"] } else { "" }) })
          Write-Host "::notice title=inventory models $env:TAG::$($mlines -join '%0A')"
          $dlines = @($licTexts.Keys | Sort-Object | ForEach-Object { $v = $licTexts[$_]; "$_ apache2_full=$($v.apache2_full) lgpl3_full=$($v.lgpl3_full) lgpl21_full=$($v.lgpl21_full) ccby4_full=$($v.ccby4_full) polyform=$($v.mentions_polyform) insightface=$($v.mentions_insightface)" })
          Write-Host "::notice title=inventory docs $env:TAG::$($dlines -join '%0A')"
          $alines = @($assets | ForEach-Object { "$($_.name) $($_.bytes) $($_.sha256)" })
          Write-Host "::notice title=inventory assets $env:TAG::$($alines -join '%0A')"
          $other = @($files | Where-Object { $_.path -like "*.dll" -and ($_.path -match "(?i)cudnn|cublas|cufft|curand|nvrtc|cudart|DirectML|onnxruntime|Qt6|libraw|opencv") } | ForEach-Object { "$($_.path) $($_.bytes)" })
          Write-Host "::notice title=inventory runtime dlls $env:TAG::$($other -join '%0A')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-${{ matrix.tag }}
          path: inventory/
          retention-days: 30

  lic1-checks:
    if: github.event.inputs.lic1_checks == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python packages
        run: python -m pip install --disable-pip-version-check -q -r packaging/requirements-directml.txt "pytest>=9,<10" "pytest-qt>=4.4,<5"
      - name: Verified weights only (the allow-list decides what is fetched)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q onnx==1.23.2
          python scripts/fetch_models.py --purpose identity,quality,gpu
          python scripts/shrink_models.py --dest models/weights
          Get-ChildItem models/weights | ForEach-Object { Write-Host "$($_.Name) $($_.Length)" }
      - name: LIC-1 tests (network open)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $tests = "tests/unit/test_model_policy.py tests/unit/test_load_log.py tests/unit/test_provenance.py tests/unit/test_old_cache.py tests/unit/test_user_edits.py tests/unit/test_fallback_paths.py tests/unit/test_analysis_without_recogniser.py tests/unit/test_network_blocked.py tests/unit/test_selftest.py tests/unit/test_media_models.py tests/gui/test_manual_grouping.py tests/gui/test_mode_picker.py tests/unit/test_packaging.py tests/unit/test_grp1_counts.py tests/media".Split(" ")
          python -m pytest -q -p no:cacheprovider -rs @tests *>&1 | Tee-Object -FilePath lic1.log
          Write-Host "::notice title=LIC-1 tests (network open)::$((Get-Content lic1.log -Tail 3) -join ' | ')"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Same tests and the self-test with the Windows firewall blocking python.exe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $py = (Get-Command python).Source
          New-NetFirewallRule -DisplayName "KiraPick LIC-1 no network" -Direction Outbound -Action Block -Program $py | Out-Null
          try {
            python -c "import socket; socket.create_connection(('example.com', 443), timeout=5)"
            if ($LASTEXITCODE -eq 0) { Write-Host "::error::the firewall rule did not block python.exe"; exit 1 }
            Write-Host "::notice title=firewall::outbound connections of python.exe are blocked"
            $tests = "tests/unit/test_network_blocked.py tests/unit/test_analysis_without_recogniser.py tests/unit/test_selftest.py tests/gui/test_mode_picker.py".Split(" ")
            python -m pytest -q -p no:cacheprovider -rs @tests *>&1 | Tee-Object -FilePath lic1fw.log
            $code = $LASTEXITCODE
            Write-Host "::notice title=LIC-1 tests (firewall)::$((Get-Content lic1fw.log -Tail 3) -join ' | ')"
            python -c "from app import selftest; import sys, json, pathlib; p = pathlib.Path('selftest_fw.json'); rc = selftest.run(p); d = json.loads(p.read_text(encoding='utf-8')); print('ok', d['ok'], 'network_attempts', d['network_attempts'], 'opened', sorted(d['report_a']['personal']['opened'])); sys.exit(rc)"
            if ($LASTEXITCODE -ne 0 -or $code -ne 0) { exit 1 }
          } finally {
            Remove-NetFirewallRule -DisplayName "KiraPick LIC-1 no network"
          }

  k2-repeat:
    if: github.event.inputs.k2_repeat == 'true'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: python -m pip install --disable-pip-version-check -q -r packaging/requirements-directml.txt "pytest>=9,<10" "pytest-qt>=4.4,<5"
      - name: 20 fresh-process runs per test
        shell: pwsh
        run: |
          $out = python scripts/k2_repeat.py --runs 20 --out k2 2>&1
          $code = $LASTEXITCODE
          $out | Write-Host
          foreach ($line in ($out | Where-Object { $_ -like "K2 *" })) { Write-Host "::notice title=k2::$line" }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirapick-k2-windows
          path: k2/
          retention-days: 30

  perf:
    if: github.event.inputs.run_perf == 'true' || contains(github.event.head_commit.message, '[perf]')
    runs-on: windows-2022
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -q -r packaging/requirements-directml.txt "pytest>=9,<10" "pytest-qt>=4.4,<5"
      - name: Screen and fonts (a bigger desktop for the real-platform steps; what Qt sees)
        if: always()
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "resolution not changed: $_" }
          foreach ($p in "offscreen", "windows") {
            $env:QT_QPA_PLATFORM = $p
            $line = (python scripts/qt_env_report.py 2>&1 | Select-Object -Last 1)
            Write-Host "::notice title=qt $p::$line"
          }
      - name: Full test suite (offscreen)
        if: always()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          . scripts/ci_report.ps1
          $code = Invoke-Pytest -Log suite.log -Title suite -TimeoutSec 1500 -PytestArgs @()
          exit $code
      - name: GUI smoke on the real Windows platform (Windows fonts, real windows; each file alone, 4 min each)
        if: always()
        timeout-minutes: 50
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          COLUMNS: "1500"
          KIRAPICK_EXIT_WATCHDOG: "60"
        run: |
          . scripts/ci_report.ps1
          $failed = 0
          $gui = @("test_compare_tile", "test_compare_view", "test_compare_window", "test_compare_actions",
                   "test_compare_overlay", "test_compare_final", "test_qt_image", "test_viewer_frames",
                   "test_view_rotation", "test_main_window", "test_adaptive_layout", "test_detail_panel",
                   "test_review_notes_t15")
          foreach ($f in $gui) {
            try {
              $code = Invoke-Pytest -Log "gui_$f.log" -Title "gui-windows $f" -TimeoutSec 240 -PytestArgs @("tests/gui/$f.py")
            } catch {
              Write-Host "::notice title=gui-windows $f REPORT ERROR::$_"
              $code = 1
            }
            if ($code -ne 0) { $failed++ }
          }
          Write-Host "::notice title=gui-windows::files failed: $failed of $($gui.Count)"
          exit $failed
      - name: Export GUI on the real Windows platform (part 3; its own step so its notices are not cut at 10)
        if: always()
        timeout-minutes: 20
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          COLUMNS: "1500"
          KIRAPICK_EXIT_WATCHDOG: "60"
        run: |
          . scripts/ci_report.ps1
          $failed = 0
          $gui = @("test_export_dialog_p3", "test_export_plan_thread", "test_export_runs")
          foreach ($f in $gui) {
            try {
              $code = Invoke-Pytest -Log "gui_$f.log" -Title "gui-export $f" -TimeoutSec 240 -PytestArgs @("tests/gui/$f.py")
            } catch {
              Write-Host "::notice title=gui-export $f REPORT ERROR::$_"
              $code = 1
            }
            if ($code -ne 0) { $failed++ }
          }
          Write-Host "::notice title=gui-export::files failed: $failed of $($gui.Count)"
          exit $failed
      - name: Compare GUI on the real Windows platform, 5 more rounds (hover / routing stability; BR-01)
        if: always()
        timeout-minutes: 45
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          KIRAPICK_COMPARE_ROUNDS: "5"
          COLUMNS: "1500"
          KIRAPICK_EXIT_WATCHDOG: "60"
        run: |
          . scripts/ci_report.ps1
          $failed = 0
          for ($i = 1; $i -le $env:KIRAPICK_COMPARE_ROUNDS; $i++) {
            $code = Invoke-Pytest -Log "rep_$i.log" -Title "compare repeat $i" -TimeoutSec 600 -PytestArgs @(
              "tests/gui/test_compare_view.py", "tests/gui/test_compare_window.py", "tests/gui/test_compare_actions.py",
              "tests/gui/test_compare_overlay.py", "tests/gui/test_compare_final.py")
            if ($code -ne 0) { $failed++ }
          }
          exit $failed
      - name: Compare hover diagnostic (real Windows platform; CR-P2-FINAL-01)
        if: always()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          python -X faulthandler scripts/diag_compare_hover.py --out diag.jsonl *>&1 | Tee-Object -FilePath diag.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Host "::notice title=diag exit::exit $code; $((Get-Content diag.log | Select-Object -Last 15) -join ' | ')" }
          if (Test-Path diag.jsonl) { Write-Host "::notice title=diag::$((Get-Content diag.jsonl | Measure-Object).Count) scenarios written (artifact)" }
          $s7 = (Get-Content diag.log | Where-Object { $_ -match "^S7 " } | Select-Object -Last 1)
          if ($s7) { Write-Host "::notice title=diag S7 (resting inside a new window; MouseMove delivered)::$s7" }
          $s8 = (Get-Content diag.log | Where-Object { $_ -match "^S8 " } | Select-Object -Last 1)
          if ($s8) { Write-Host "::notice title=diag S8 (ways to move into a window opened under the pointer)::$s8" }
          exit $code
      - name: Snap sizes and per-monitor DPI scale (real Windows platform)
        if: always()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $failed = 0
          foreach ($f in "1", "1.25", "1.5", "2") {
            $env:QT_SCALE_FACTOR = $f
            $out = python -m pytest -q -p no:cacheprovider tests/gui/test_snap_sizes.py 2>&1
            if ($LASTEXITCODE -ne 0) { $failed++ }
            $summary = ($out | Where-Object { $_ -match "(passed|failed|error)" } | Select-Object -Last 1)
            $failures = ($out | Where-Object { $_ -match "^(FAILED|E  ) " } | Select-Object -First 4) -join " | "
            Write-Host "::notice title=snap-dpi $f::$summary $failures"
          }
          exit $failed
      - name: Performance tests
        if: always()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          KIRAPICK_PERF_OUT: perf.jsonl
        run: |
          . scripts/ci_report.ps1
          $code = Invoke-Pytest -Log perf.log -Title perf-tests -TimeoutSec 2400 -PytestArgs @("-m", "perf", "tests/perf")
          exit $code
      - name: Performance results (4 results per notice; a job keeps only 50 notices)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path perf.jsonl) {
            $all = @(Get-Content perf.jsonl)
            for ($i = 0; $i -lt $all.Count; $i += 4) { Write-Host "::notice title=perf::$(($all[$i..([Math]::Min($i + 3, $all.Count - 1))]) -join ' || ')" }
          }
      - name: Performance variance (BR-02; the three tests 5 times each, then median / p95 / worst across runs)
        if: always()
        timeout-minutes: 60
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          KIRAPICK_PERF_OUT: variance.jsonl
        run: |
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $mem = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)
          Write-Host "::notice title=runner::$($cpu.Name) | $($cpu.NumberOfCores) cores / $($cpu.NumberOfLogicalProcessors) threads | $mem GB RAM | $env:ImageOS $env:ImageVersion"
          for ($i = 1; $i -le 5; $i++) {
            python -m pytest -q -p no:cacheprovider -m perf "tests/perf/test_compare_perf.py::test_compare_on_a_large_session" "tests/perf/test_grid_perf.py::test_sustained_culling[10000]" "tests/perf/test_grid_perf.py::test_long_session_gc_and_memory" *>&1 | Select-Object -Last 3
          }
          python scripts/perf_variance.py variance.jsonl
      - name: Shutdown and worker stress (not reproduced in N runs is not proof)
        if: always()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          . scripts/ci_report.ps1
          $failed = 0  # every run counts (a loop would otherwise report only its last run)
          python -X faulthandler -m pytest -q -p no:cacheprovider -o faulthandler_timeout=180 -o faulthandler_exit_on_timeout=true -m stress tests/gui/test_worker_lifecycle.py tests/gui/test_compare_lifecycle.py *>&1 | Tee-Object -FilePath stress0.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { $failed++; Report-Pytest -Log stress0.log -Title "stress run 0" -Code $code }
          for ($i = 1; $i -le 5; $i++) {
            python -X faulthandler -m pytest -q -p no:cacheprovider -o faulthandler_timeout=180 -o faulthandler_exit_on_timeout=true tests/gui/test_shutdown_timeout.py tests/gui/test_shutdown_callbacks.py tests/unit/test_shutdown.py tests/gui/test_compare_lifecycle.py *>&1 | Tee-Object -FilePath "stress$i.log"
            $code = $LASTEXITCODE
            if ($code -ne 0) { $failed++; Report-Pytest -Log "stress$i.log" -Title "stress run $i" -Code $code }
          }
          Write-Host "::notice title=stress::failed runs: $failed of 6"
          exit $failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirapick-perf-windows
          path: |
            perf.jsonl
            suite.log
            gui_*.log
            rep_*.log
            diag.jsonl
            stress*.log
          retention-days: 30
