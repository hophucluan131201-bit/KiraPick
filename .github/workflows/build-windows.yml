# Builds the Windows installers on a clean Windows machine and publishes them.
# Which edition is built and published is chosen by a marker in the pushed commit message
# (main or beta branch):
#   [release]          DirectML edition, version from app/__init__.py (official if it has no a/b/rc suffix)
#   [release-cuda]     CUDA edition (NVIDIA), version + "a", always a pre-release
#   [release-openvino] OpenVINO edition (Intel CPU), version + "b", always a pre-release
#   [release-all]      all three
# Actions tab -> "Build Windows installer" -> Run workflow: build all three, artifacts only (no release).
name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      editions:
        description: "Editions to build (comma-separated: directml,cuda,openvino)"
        default: "directml,cuda,openvino"
      run_perf:
        description: "Also run the Windows tests: full suite, GUI smoke, Snap/DPI, performance, stress (no build needed)"
        type: boolean
        default: false
  push:
    branches: [main, beta]

permissions:
  contents: write  # needed to create the Release

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      editions: ${{ steps.pick.outputs.editions }}
    steps:
      - id: pick
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
          WANTED: ${{ github.event.inputs.editions }}
        run: |
          python3 - <<'EOF'
          import json, os
          msg, event = os.environ.get("MESSAGE", ""), os.environ["EVENT"]
          if event != "push":
              editions = [e.strip() for e in (os.environ.get("WANTED") or "directml,cuda,openvino").split(",") if e.strip()]
          elif "[release-all]" in msg:
              editions = ["directml", "cuda", "openvino"]
          else:
              editions = [e for e, m in (("directml", "[release]"), ("cuda", "[release-cuda]"),
                                         ("openvino", "[release-openvino]")) if m in msg]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"editions={json.dumps(editions)}\n")
          print(editions)
          EOF

  build:
    needs: plan
    if: needs.plan.outputs.editions != '[]'
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJson(needs.plan.outputs.editions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build, self-test (network blocked), package
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1 -NonInteractive -Edition ${{ matrix.edition }} *>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # The end of the log as an annotation: readable through the API without the log storage host.
            $tail = (Get-Content build.log -Tail 25 | ForEach-Object { if ($_.Length -gt 160) { $_.Substring(0, 160) } else { $_ } }) -join "%0A"
            Write-Host "::error title=build_windows.ps1 failed (${{ matrix.edition }})::$tail"
            exit $code
          }
          if (Test-Path dist/selftest.json) {  # self-test summary, readable through the API
            $r = Get-Content dist/selftest.json -Raw | ConvertFrom-Json
            Write-Host ("::notice title=self-test (${{ matrix.edition }})::ok=" + $r.ok + " version=" + $r.version + " edition=" + $r.edition + " steps=" + ($r.steps -join " | ") + " gpu=" + ($r.gpu | ConvertTo-Json -Compress -Depth 3))
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirapick-windows-${{ matrix.edition }}
          path: |
            dist/installer/*
            dist/selftest.json
          retention-days: 30
      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8  # the title has an en dash
          $env:PYTHONUTF8 = "1"
          $edition = "${{ matrix.edition }}"
          $version = (python -c "from app import __version__; from app.edition import version_for; print(version_for(__version__, '$edition'))").Trim()
          $title = (python -c "from app.edition import release_name; print(release_name('$version', '$edition'))").Trim()
          $tag = "v$version"
          if ($edition -eq "cuda") {
            # Over GitHub's 2 GB per file as one zip: Setup.exe + its .bin data files + the install guide.
            $files = Get-ChildItem dist/installer -File | Where-Object { $_.Extension -in ".exe", ".bin", ".txt" } | ForEach-Object { $_.FullName }
          } else {
            # Only the zips: the small Setup.exe is useless without its .bin data file (both are in BoCai.zip).
            $files = Get-ChildItem dist/installer -File -Filter *.zip | ForEach-Object { $_.FullName }
          }
          if (gh release view $tag 2>$null) { Write-Host "Release $tag already exists: left untouched"; exit 0 }
          if ($edition -ne "directml" -or $version -match '(a|b|rc)\d+$') {  # betas: pre-release
            gh release create $tag $files --target "${{ github.sha }}" --title "$title" --notes-file packaging/notes/RELEASE_NOTES.md --prerelease
          } else {
            gh release create $tag $files --target "${{ github.sha }}" --title "$title" --notes-file packaging/notes/RELEASE_NOTES.md --latest
          }

  # Tests on a real Windows machine (Python 3.12): the full test suite, a GUI smoke run on the real `windows` platform
  # (Windows fonts), Snap sizes at 100/125/150/200 %, performance (synthetic 1k-10k sessions, HD thumbnails) and
  # shutdown / worker stress. Never blocks anything and never publishes: started by hand ("run_perf") or by "[perf]"
  # in a commit message. Each part prints its OWN notice (suite / gui-windows / snap-dpi / perf / stress): the job is
  # non-blocking, so a green job is not evidence that any part passed (review RV14-01) — read the notices.
  perf:
    if: github.event.inputs.run_perf == 'true' || contains(github.event.head_commit.message, '[perf]')
    runs-on: windows-2022
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -q -r packaging/requirements-directml.txt "pytest>=8,<10" "pytest-qt>=4.4,<5"
      - name: Full test suite (offscreen)
        if: always()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -X faulthandler -m pytest -q -p no:cacheprovider *>&1 | Tee-Object -FilePath suite.log
          $code = $LASTEXITCODE
          $summary = (Get-Content suite.log | Where-Object { $_ -match "(passed|failed|error)" } | Select-Object -Last 1)
          $failures = (Get-Content suite.log | Where-Object { $_ -match "^(FAILED|ERROR) " } | Select-Object -First 8) -join " | "
          Write-Host "::notice title=suite::exit $code; $summary $failures"
          exit $code
      - name: GUI smoke on the real Windows platform (Windows fonts, real windows)
        if: always()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          python -X faulthandler -m pytest -q -p no:cacheprovider tests/gui/test_main_window.py tests/gui/test_adaptive_layout.py tests/gui/test_review_notes_t15.py *>&1 | Tee-Object -FilePath gui.log
          $code = $LASTEXITCODE
          $summary = (Get-Content gui.log | Where-Object { $_ -match "(passed|failed|error)" } | Select-Object -Last 1)
          $failures = (Get-Content gui.log | Where-Object { $_ -match "^(FAILED|ERROR) " } | Select-Object -First 8) -join " | "
          Write-Host "::notice title=gui-windows::exit $code; $summary $failures"
          exit $code
      - name: Snap sizes and per-monitor DPI scale (real Windows platform)
        if: always()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $failed = 0
          foreach ($f in "1", "1.25", "1.5", "2") {
            $env:QT_SCALE_FACTOR = $f
            $out = python -m pytest -q -p no:cacheprovider tests/gui/test_snap_sizes.py 2>&1
            if ($LASTEXITCODE -ne 0) { $failed++ }
            $summary = ($out | Where-Object { $_ -match "(passed|failed|error)" } | Select-Object -Last 1)
            $failures = ($out | Where-Object { $_ -match "^(FAILED|E  ) " } | Select-Object -First 4) -join " | "
            Write-Host "::notice title=snap-dpi $f::$summary $failures"
          }
          exit $failed
      - name: Performance tests
        if: always()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          KIRAPICK_PERF_OUT: perf.jsonl
        run: python -m pytest -q -m perf tests/perf
      - name: Performance results (GitHub shows 10 notices per step, so two steps)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path perf.jsonl) { Get-Content perf.jsonl | Select-Object -First 10 | ForEach-Object { Write-Host "::notice title=perf::$_" } }
      - name: Performance results (continued)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path perf.jsonl) { Get-Content perf.jsonl | Select-Object -Skip 10 | ForEach-Object { Write-Host "::notice title=perf::$_" } }
      - name: Shutdown and worker stress (not reproduced in N runs is not proof)
        if: always()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $failed = 0  # every run counts (a loop would otherwise report only its last run)
          python -X faulthandler -m pytest -q -m stress tests/gui/test_worker_lifecycle.py
          if ($LASTEXITCODE -ne 0) { $failed++ }
          for ($i = 1; $i -le 5; $i++) {
            python -X faulthandler -m pytest -q tests/gui/test_shutdown_timeout.py tests/gui/test_shutdown_callbacks.py tests/unit/test_shutdown.py
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          Write-Host "::notice title=stress::failed runs: $failed of 6"
          exit $failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirapick-perf-windows
          path: |
            perf.jsonl
            suite.log
            gui.log
          retention-days: 30
