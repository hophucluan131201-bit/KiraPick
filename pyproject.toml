[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kirapick"
version = "2.1.0b5"
description = "Offline, non-destructive AI photo culling for cosplay/street photographers (Windows desktop)."
requires-python = ">=3.11,<3.15"
# Supported ranges; exact versions verified so far are recorded in requirements.lock.txt.
dependencies = [
    "rawpy>=0.25,<0.28",       # LibRaw >= 0.21 needed for CR3 / recent Nikon Z bodies
    "numpy>=1.26,<3",
    "pillow>=10.3,<14",
    "exifread>=3.0,<4",
    "pyyaml>=6.0,<7",
    "PySide6>=6.8,<6.13",      # LGPLv3: shipped as separate DLLs (PyInstaller onedir)
    "opencv-python-headless>=4.10,<5",  # Apache-2.0: YuNet/SFace face models
    # Windows: GPU build; CUDA 13 + cuDNN 9 DLLs come as pip packages inside the venv.
    # It still runs on CPU-only PCs. Elsewhere (dev container, CI): CPU build.
    # (No GPU wheel for Python 3.14 on Windows yet -> CPU build there.)
    "onnxruntime-gpu[cuda,cudnn]>=1.23,<2; sys_platform == 'win32' and python_version < '3.14'",
    "onnxruntime>=1.20,<2; sys_platform != 'win32' or python_version >= '3.14'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5"]

[project.scripts]
kirapick-raw-probe = "app.ingest.cli:main"

[project.gui-scripts]
kirapick = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "samples: needs real RAW samples under test_photos/ (skipped when absent)",
    "slow: full demosaic of real RAW files",
    "gui: drives the Qt main window (offscreen)",
]
