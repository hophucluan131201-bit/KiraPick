<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <!-- KiraPick mode picker: "Chụp cá nhân" (an original flat illustration; no photo, no real person) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2350"/>
      <stop offset="0.55" stop-color="#3b2f6e"/>
      <stop offset="1" stop-color="#1c1838"/>
    </linearGradient>
    <radialGradient id="bokeh" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b9a4ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#b9a4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bokeh2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8b7ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#e8b7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26306e"/>
      <stop offset="1" stop-color="#151a45"/>
    </linearGradient>
    <linearGradient id="hairShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b6cd6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7d8cf0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5b6cd6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe3d8"/>
      <stop offset="1" stop-color="#f0c9bb"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f4bb8"/>
      <stop offset="1" stop-color="#1b2a78"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dc95"/>
      <stop offset="1" stop-color="#c9a24c"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.7" stop-color="#1e1f22" stop-opacity="0"/>
      <stop offset="1" stop-color="#1e1f22" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="480" fill="url(#bg)"/>
  <!-- blossoms out of focus -->
  <g>
    <circle cx="90" cy="90" r="70" fill="url(#bokeh)"/>
    <circle cx="180" cy="230" r="55" fill="url(#bokeh2)"/>
    <circle cx="60" cy="380" r="90" fill="url(#bokeh)"/>
    <circle cx="250" cy="70" r="40" fill="url(#bokeh2)"/>
    <circle cx="300" cy="400" r="60" fill="url(#bokeh)"/>
    <circle cx="760" cy="80" r="80" fill="url(#bokeh)"/>
    <circle cx="890" cy="200" r="65" fill="url(#bokeh2)"/>
    <circle cx="950" cy="60" r="45" fill="url(#bokeh)"/>
    <circle cx="840" cy="400" r="95" fill="url(#bokeh2)"/>
    <circle cx="960" cy="330" r="50" fill="url(#bokeh)"/>
    <circle cx="700" cy="300" r="35" fill="url(#bokeh2)"/>
  </g>

  <!-- hair behind -->
  <path d="M370 140 C360 60 450 10 520 18 C610 26 660 90 650 170 C672 260 690 360 720 480 L330 480 C352 380 372 260 370 140 Z" fill="url(#hair)"/>
  <!-- robe / shoulders -->
  <path d="M330 480 C340 392 400 346 470 336 L560 336 C640 346 700 392 720 480 Z" fill="url(#robe)"/>
  <path d="M470 336 L515 460 L560 336" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linejoin="round"/>
  <path d="M440 350 C470 405 495 450 515 480" fill="none" stroke="#e9eefc" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <path d="M590 350 C560 405 535 450 515 480" fill="none" stroke="#e9eefc" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <circle cx="630" cy="410" r="20" fill="#f3f5ff" opacity="0.92"/>
  <circle cx="630" cy="410" r="6" fill="url(#gold)"/>
  <!-- neck -->
  <path d="M490 296 L490 340 L540 340 L540 296 Z" fill="url(#skin)"/>
  <!-- face -->
  <path d="M440 170 C440 110 480 80 515 80 C552 80 592 110 592 170 C592 238 556 306 515 312 C474 306 440 238 440 170 Z" fill="url(#skin)"/>
  <!-- fringe -->
  <path d="M430 175 C428 105 470 62 520 62 C575 62 610 108 602 178 C590 140 570 118 548 110 C540 135 520 150 498 156 C505 138 507 122 503 110 C480 120 455 140 430 175 Z" fill="url(#hair)"/>
  <path d="M470 80 C500 70 540 70 575 90" fill="none" stroke="url(#hairShine)" stroke-width="10" stroke-linecap="round"/>
  <!-- side locks -->
  <path d="M436 170 C430 230 440 300 420 380 C450 330 462 260 458 190 Z" fill="url(#hair)"/>
  <path d="M598 170 C606 230 596 300 616 380 C586 330 574 260 578 190 Z" fill="url(#hair)"/>
  <!-- eyes -->
  <g>
    <path d="M466 200 C478 190 496 190 506 200" fill="none" stroke="#1d1f3d" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="486" cy="207" rx="10" ry="8" fill="#3a3f8f"/>
    <circle cx="489" cy="204" r="3" fill="#ffffff"/>
    <path d="M526 200 C536 190 554 190 566 200" fill="none" stroke="#1d1f3d" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="546" cy="207" rx="10" ry="8" fill="#3a3f8f"/>
    <circle cx="549" cy="204" r="3" fill="#ffffff"/>
  </g>
  <path d="M510 268 C516 272 524 272 530 268" fill="none" stroke="#c96d78" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="470" cy="240" rx="16" ry="8" fill="#f2a7b4" opacity="0.45"/>
  <ellipse cx="562" cy="240" rx="16" ry="8" fill="#f2a7b4" opacity="0.45"/>

  <!-- hair ornament: flower + tassel -->
  <g transform="translate(612 112)">
    <g fill="#8fa2ff">
      <ellipse cx="0" cy="-26" rx="13" ry="24"/>
      <ellipse cx="0" cy="-26" rx="13" ry="24" transform="rotate(72)"/>
      <ellipse cx="0" cy="-26" rx="13" ry="24" transform="rotate(144)"/>
      <ellipse cx="0" cy="-26" rx="13" ry="24" transform="rotate(216)"/>
      <ellipse cx="0" cy="-26" rx="13" ry="24" transform="rotate(288)"/>
    </g>
    <circle r="11" fill="url(#gold)"/>
    <path d="M-6 30 L-14 120" stroke="url(#gold)" stroke-width="4"/>
    <path d="M-14 120 L-24 170 L-4 170 Z" fill="#3c5ad6"/>
  </g>

  <!-- viewfinder: focus on the eye -->
  <g fill="none" stroke="#4c8dff" stroke-width="5" stroke-linecap="round">
    <path d="M300 60 L300 30 L330 30"/>
    <path d="M700 30 L730 30 L730 60"/>
    <path d="M300 420 L300 450 L330 450"/>
    <path d="M700 450 L730 450 L730 420"/>
  </g>
  <rect x="462" y="186" width="48" height="40" rx="4" fill="none" stroke="#3fb950" stroke-width="4"/>

  <rect width="1000" height="480" fill="url(#fade)"/>
</svg>
