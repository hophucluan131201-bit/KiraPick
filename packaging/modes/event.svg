<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <!-- KiraPick mode picker: "Media sự kiện" (an original flat illustration; no photo, no real person) -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140f26"/>
      <stop offset="1" stop-color="#241a3d"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4fd8"/>
      <stop offset="0.5" stop-color="#d77bd1"/>
      <stop offset="1" stop-color="#5a8cf0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ec3ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9ec3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2f58"/>
      <stop offset="1" stop-color="#1f1830"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="phone" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfe0ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#cfe0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="480" fill="url(#night)"/>

  <!-- LED screens with blossoms and a pagoda -->
  <rect x="300" y="110" width="400" height="200" rx="6" fill="url(#screen)"/>
  <rect x="150" y="130" width="130" height="180" rx="6" fill="url(#screen)" opacity="0.8"/>
  <rect x="720" y="130" width="130" height="180" rx="6" fill="url(#screen)" opacity="0.8"/>
  <g fill="#ffd1ec" opacity="0.75">
    <circle cx="330" cy="140" r="22"/><circle cx="365" cy="132" r="16"/><circle cx="660" cy="140" r="24"/>
    <circle cx="690" cy="160" r="14"/><circle cx="185" cy="160" r="18"/><circle cx="820" cy="170" r="20"/>
  </g>
  <g fill="#3b2a6e" opacity="0.85">
    <path d="M455 300 L455 230 L545 230 L545 300 Z"/>
    <path d="M430 235 L500 200 L570 235 Z"/>
    <path d="M465 205 L500 180 L535 205 Z"/>
  </g>

  <!-- truss -->
  <g stroke="#7a6f96" stroke-width="5" fill="none">
    <path d="M90 60 L910 60 M90 84 L910 84"/>
    <path d="M90 60 L90 360 M910 60 L910 360 M114 84 L114 360 M886 84 L886 360"/>
  </g>
  <g stroke="#7a6f96" stroke-width="3">
    <path d="M100 60 L124 84 M148 60 L172 84 M196 60 L220 84 M244 60 L268 84 M292 60 L316 84 M340 60 L364 84 M388 60 L412 84 M436 60 L460 84 M484 60 L508 84 M532 60 L556 84 M580 60 L604 84 M628 60 L652 84 M676 60 L700 84 M724 60 L748 84 M772 60 L796 84 M820 60 L844 84 M868 60 L892 84"/>
  </g>

  <!-- light beams -->
  <path d="M200 84 L120 360 L300 360 Z" fill="url(#beam)"/>
  <path d="M380 84 L300 360 L470 360 Z" fill="url(#beamBlue)"/>
  <path d="M620 84 L530 360 L700 360 Z" fill="url(#beam)"/>
  <path d="M800 84 L700 360 L880 360 Z" fill="url(#beamBlue)"/>
  <g>
    <circle cx="200" cy="84" r="16" fill="url(#lamp)"/>
    <circle cx="380" cy="84" r="16" fill="url(#lamp)"/>
    <circle cx="500" cy="84" r="12" fill="url(#lamp)"/>
    <circle cx="620" cy="84" r="16" fill="url(#lamp)"/>
    <circle cx="800" cy="84" r="16" fill="url(#lamp)"/>
  </g>

  <!-- stage and performers -->
  <rect x="80" y="330" width="840" height="40" fill="url(#stage)"/>
  <g>
    <g transform="translate(250 330)"><circle cx="0" cy="-58" r="10" fill="#f0c9bb"/><path d="M-12 -46 L12 -46 L18 0 L-18 0 Z" fill="#e05a7a"/><path d="M-10 -66 C-4 -78 10 -76 12 -60 L14 -30 L8 -50 Z" fill="#ffb347"/></g>
    <g transform="translate(380 330)"><circle cx="0" cy="-62" r="10" fill="#f0c9bb"/><path d="M-12 -50 L12 -50 L20 0 L-20 0 Z" fill="#f2f2f7"/><path d="M-12 -70 C0 -82 14 -72 12 -56 L16 -20 L6 -52 Z" fill="#8fd3ff"/><path d="M12 -48 L40 -70" stroke="#f0c9bb" stroke-width="5" stroke-linecap="round"/></g>
    <g transform="translate(500 330)"><circle cx="0" cy="-66" r="11" fill="#f0c9bb"/><path d="M-14 -53 L14 -53 L22 0 L-22 0 Z" fill="#c8323c"/><path d="M-14 -53 L14 -53" stroke="#f6dc95" stroke-width="4"/><path d="M-12 -74 C0 -86 14 -78 13 -62 L16 -24 L4 -56 Z" fill="#2a2140"/><path d="M14 -50 L44 -78" stroke="#f0c9bb" stroke-width="5" stroke-linecap="round"/></g>
    <g transform="translate(620 330)"><circle cx="0" cy="-60" r="10" fill="#f0c9bb"/><path d="M-12 -48 L12 -48 L18 0 L-18 0 Z" fill="#6aa0e8"/><path d="M-12 -68 C0 -80 14 -70 12 -54 L14 -24 L6 -50 Z" fill="#d7e6ff"/></g>
    <g transform="translate(750 330)"><circle cx="0" cy="-58" r="10" fill="#f0c9bb"/><path d="M-12 -46 L12 -46 L18 0 L-18 0 Z" fill="#2c2c3a"/><path d="M-12 -66 C0 -78 14 -68 12 -52 L14 -22 L6 -48 Z" fill="#5a3b2a"/></g>
  </g>

  <!-- audience, phones raised -->
  <g fill="#0d0a18">
    <circle cx="60" cy="430" r="34"/><path d="M10 480 C14 450 106 450 110 480 Z"/>
    <circle cx="170" cy="420" r="30"/><path d="M120 480 C126 446 214 446 220 480 Z"/>
    <circle cx="290" cy="440" r="32"/><path d="M240 480 C246 460 334 460 340 480 Z"/>
    <circle cx="410" cy="425" r="30"/><path d="M360 480 C366 450 454 450 460 480 Z"/>
    <circle cx="530" cy="438" r="33"/><path d="M478 480 C484 458 576 458 582 480 Z"/>
    <circle cx="650" cy="422" r="31"/><path d="M598 480 C604 448 696 448 702 480 Z"/>
    <circle cx="770" cy="436" r="32"/><path d="M718 480 C724 456 816 456 822 480 Z"/>
    <circle cx="890" cy="426" r="31"/><path d="M838 480 C844 450 936 450 942 480 Z"/>
    <circle cx="975" cy="440" r="30"/>
  </g>
  <g>
    <rect x="198" y="372" width="16" height="26" rx="3" fill="#cfe0ff"/><circle cx="206" cy="385" r="22" fill="url(#phone)"/>
    <rect x="452" y="366" width="16" height="26" rx="3" fill="#cfe0ff"/><circle cx="460" cy="379" r="22" fill="url(#phone)"/>
    <rect x="690" y="368" width="16" height="26" rx="3" fill="#cfe0ff"/><circle cx="698" cy="381" r="22" fill="url(#phone)"/>
  </g>

  <!-- timeline of moments (how Media mode reviews an event) -->
  <g>
    <rect x="300" y="18" width="400" height="26" rx="13" fill="#1e1f22" opacity="0.75"/>
    <path d="M322 31 L678 31" stroke="#4c8dff" stroke-width="3"/>
    <circle cx="340" cy="31" r="7" fill="#4c8dff"/>
    <circle cx="450" cy="31" r="7" fill="#4c8dff"/>
    <circle cx="560" cy="31" r="9" fill="#ffffff" stroke="#4c8dff" stroke-width="4"/>
    <circle cx="660" cy="31" r="7" fill="#4c8dff" opacity="0.6"/>
  </g>
</svg>
